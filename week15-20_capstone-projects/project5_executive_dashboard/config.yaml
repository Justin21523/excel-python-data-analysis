# Executive Dashboard System Configuration

integration:
  # 整合的項目
  projects:
    - sales_intelligence
    - customer_insights
    - inventory_optimizer
    - operations_monitor

  # 數據更新頻率（小時）
  refresh_interval: 1

dashboard:
  # 儀表板設置
  theme: 'dark'
  layout: 'grid'

  # 關鍵指標
  key_metrics:
    - 'revenue'
    - 'growth'
    - 'customer_retention'
    - 'operational_efficiency'
    - 'profitability'
    - 'market_position'

  # 圖表類型
  charts:
    - 'revenue_trend'
    - 'customer_retention_trend'
    - 'operational_metrics'
    - 'inventory_health'

alerts:
  # 警告設置
  enabled: true
  severity_levels:
    - CRITICAL
    - HIGH
    - MEDIUM
    - LOW

output:
  directory: './outputs'
  formats:
    - 'html'
    - 'pdf'
    - 'json'

logging:
  level: 'INFO'
  file: './executive_dashboard.log'
