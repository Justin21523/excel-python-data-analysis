# Sales Intelligence Dashboard Configuration
# 銷售智能儀表板配置檔

# 數據配置
data:
  # 數據源路徑
  path: './data'

  # CSV 文件名稱
  files:
    orders: 'olist_orders_dataset.csv'
    order_items: 'olist_order_items_dataset.csv'
    customers: 'olist_customers_dataset.csv'
    products: 'olist_products_dataset.csv'
    order_reviews: 'olist_order_reviews_dataset.csv'
    sellers: 'olist_sellers_dataset.csv'

  # 數據驗證
  validation:
    check_duplicates: true
    check_missing_values: true
    check_data_types: true

# 分析配置
analytics:
  # 異常檢測
  anomaly_detection:
    enabled: true
    std_threshold: 2.0  # 標準差閾值
    method: 'zscore'  # 'zscore' 或 'iqr'

  # ABC 分類
  abc_analysis:
    a_threshold: 80  # A 類累積百分比
    b_threshold: 95  # B 類累積百分比

  # Top N 產品
  top_products:
    n: 10

  # Top N 城市
  top_cities:
    n: 20

  # 回購客戶率閾值
  repeat_customer_threshold: 1  # 購買次數 > 1

# 視覺化配置
visualizations:
  # 輸出目錄
  output_dir: './outputs/charts'

  # 圖表設定
  charts:
    - name: 'sales_trend'
      enabled: true
      type: 'line'

    - name: 'top_products'
      enabled: true
      type: 'bar'

    - name: 'regional_heatmap'
      enabled: true
      type: 'heatmap'

    - name: 'abc_classification'
      enabled: true
      type: 'pie'

    - name: 'customer_distribution'
      enabled: true
      type: 'bar'

  # 圖表解析度
  dpi: 300

  # 圖表尺寸
  figure_size:
    width: 12
    height: 8

  # 色彩方案
  color_scheme: 'default'

# 報表配置
output:
  # 輸出目錄
  directory: './outputs'

  # 報表格式
  formats:
    - 'excel'
    - 'pdf'
    - 'json'

  # Excel 設定
  excel:
    enabled: true
    sheets:
      - '摘要'
      - '銷售概覽'
      - 'Top 10產品'
      - 'ABC分類'
      - '分類分析'
      - '地區銷售'
      - '城市排名'
      - '銷售異常'
      - '統計摘要'

    # 自動調整列寬
    auto_adjust_columns: true

  # PDF 設定
  pdf:
    enabled: true
    include_charts: true
    page_size: 'A4'

  # JSON 設定
  json:
    enabled: true
    indent: 2

# 排程配置
schedule:
  # 是否啟用排程
  enabled: false

  # 執行時間（HH:MM）
  run_time: '08:00'

  # 執行頻率
  frequency: 'daily'  # 'daily', 'weekly', 'monthly'

  # 週的哪一天（0=Monday, 6=Sunday）
  day_of_week: 0

  # 月的哪一天
  day_of_month: 1

# 郵件通知配置
email:
  # 是否啟用
  enabled: false

  # SMTP 設定
  smtp:
    server: 'smtp.gmail.com'
    port: 587
    use_tls: true

  # 認證
  sender_email: 'your-email@gmail.com'
  sender_password: 'your-app-password'

  # 收件人
  recipients:
    - 'manager@company.com'
    - 'analyst@company.com'

  # 郵件主題
  subject: '銷售智能儀表板 - 每日報告'

  # 是否附加報告
  attach_reports: true

# 日誌配置
logging:
  # 日誌級別
  level: 'INFO'  # 'DEBUG', 'INFO', 'WARNING', 'ERROR', 'CRITICAL'

  # 日誌檔案
  file: './sales_intelligence.log'

  # 日誌格式
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'

  # 最大檔案大小（MB）
  max_file_size: 10

  # 備份檔案數
  backup_count: 5

# 資料庫配置（可選）
database:
  # 是否使用資料庫
  enabled: false

  # 資料庫類型
  type: 'sqlite'  # 'sqlite', 'mysql', 'postgresql'

  # SQLite 設定
  sqlite:
    path: './sales_intelligence.db'

  # MySQL 設定
  mysql:
    host: 'localhost'
    port: 3306
    user: 'root'
    password: 'password'
    database: 'sales_db'

  # PostgreSQL 設定
  postgresql:
    host: 'localhost'
    port: 5432
    user: 'postgres'
    password: 'password'
    database: 'sales_db'

# 性能配置
performance:
  # 批量處理大小
  batch_size: 10000

  # 平行處理
  parallel_processing: false

  # 工作進程數
  num_workers: 4

  # 快取
  enable_cache: true

  # 快取目錄
  cache_dir: './.cache'

# 系統配置
system:
  # 時區
  timezone: 'Asia/Taipei'

  # 語言
  language: 'zh_TW'

  # 通貨
  currency: 'USD'

  # 日期格式
  date_format: '%Y-%m-%d'

  # 時間格式
  time_format: '%H:%M:%S'

# 功能開關
features:
  # 即時監控
  real_time_monitoring: false

  # 預測分析
  predictive_analytics: false

  # 客戶分段
  customer_segmentation: true

  # 產品推薦
  product_recommendation: false

  # 異常警告
  anomaly_alerts: true

  # A/B 測試
  ab_testing: false
