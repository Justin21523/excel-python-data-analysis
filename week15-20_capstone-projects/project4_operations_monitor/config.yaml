# Operations Monitoring System Configuration

data:
  path: './data'

monitoring:
  # KPI 閾值
  thresholds:
    order_completion_rate: 95  # %
    on_time_delivery_rate: 90  # %
    customer_satisfaction: 4.0  # /5.0
    avg_processing_time: 60  # 分鐘

  # 異常檢測
  anomaly_detection:
    enabled: true
    std_threshold: 3.0  # 標準差

  # 警告級別
  alert_levels:
    - CRITICAL
    - ALERT
    - WARNING
    - INFO

output:
  directory: './outputs'

logging:
  level: 'INFO'
  file: './operations_monitor.log'
