[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-python-data-analysis"
version = "1.0.0"
description = "Portfolio-grade Excel and CSV analytics platform built with pandas, openpyxl, and Streamlit."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1.0",
  "numpy>=1.24.0",
  "openpyxl>=3.1.0",
  "xlsxwriter>=3.1.0",
  "matplotlib>=3.7.0",
  "plotly>=5.14.0",
  "streamlit>=1.35.0",
  "scikit-learn>=1.3.0",
  "mlxtend>=0.22.0",
  "pytest>=7.4.0",
  "playwright>=1.45.0",
]

[project.scripts]
excel-analysis = "excel_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
